<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=
"width=device-width, initial-scale=1.0">
    <title>Valentine's Day Groups Divisor</title>
    <link rel="shortcut icon" href="logo_val.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
</head>

<body>
    <!-- copied and edited from https://www.geeksforgeeks.org/build-a-drag-drop-kanban-board-using-html-css-javascript/ -->
    <div class="head">
        <img src="logo_val.png">
        <h1>Valentine's Day Groups Divisor</h1>
        <div>
            Number of groups: <input type="number" name="num-of-groups" id="num-of-groups" min="1" step="1" value="4">
            Comma-separated part list: <input type="text" name="parts" id="parts" value="Alto,Soprano,TenorBass">
            <input type="file" id="data-file" name="data-file" accept=".csv">
            <input type="submit" id="upload" value="Upload" onclick="initUpdate()">
        </div>
        <div id="display-btns" style="width: 100%;"></div>
    </div>
    <div id="board">
    </div>
    <div id="res-btns" style="display:none;width:100%;margin:30px 0px;align-items:center;justify-content:center;flex-wrap:wrap;">
        <input type="submit" value="Save to a CSV" style="display:inline;margin-top:5px;" onclick="saveToFile()">
        <input type="submit" value="Display results" style="display:inline;margin:5px 0 0 10px;" onclick="displayResult()">
        <div id="results" style="width:100%;text-align:center;margin-top:30px;"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
